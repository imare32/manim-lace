[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim_lace"
dynamic = ["version"]
description = "将任意 Manim 路径转换为具有`交错编织`效果的丝带图案"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["manim", "animation", "lace", "interlacing", "celtic-knot", "rosette", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "manim>=0.19.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "manim_lace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["manim_lace"]

[tool.hatch.build.targets.sdist]
include = ["manim_lace", "tests", "README.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]
# 文档中的代码块保留手工对齐的注释, 不参与格式化
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "B905", # zip() without an explicit `strict=` parameter
    "E741", # ambiguous variable name: `l`
    "RET504", # unnecessary assignment before return
    "SIM108", # 保留显式 if/else 分支, 可读性优先
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = [
    "F403", # `from manim import *`
    "F405", # may be undefined from star imports
]
"tests/*" = [
    "F403", # `from manim import *`
    "F405", # may be undefined from star imports
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--durations=10"]

[tool.coverage.run]
branch = true
source = ["manim_lace"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# 本地开发使用清华镜像加速; CI 通过 UV_DEFAULT_INDEX 覆盖为官方 PyPI
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
