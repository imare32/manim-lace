[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-lace"
version = "0.1.0"
description = "A 2D vector-path lace/weaving engine for Manim, with topology-first geometry and explainable traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manim Lace contributors" }]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
manim = ["manim==0.22.0"]
geometry = ["shapely>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "shapely>=2.0"]
all = ["manim==0.22.0", "shapely>=2.0", "pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Manim scenes conventionally rely on `from manim import *`.
"examples/*.py" = ["F403", "F405"]
