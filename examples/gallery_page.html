<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarRosette 图形大全</title>
<style>
  :root { --bg:#16161a; --panel:#22222a; --card:#26262c; --fg:#e8e8ea; --dim:#b9b9c0; --accent:#58c4dd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(22,22,26,.95); border-bottom:1px solid #33333c; padding:10px 14px; }
  h1 { margin:0 0 8px; font-size:16px; font-weight:600; }
  h1 small { color:var(--dim); font-weight:400; font-size:12px; margin-left:8px; }
  .row { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:3px 0; }
  .label { color:var(--dim); font-size:12px; min-width:52px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  button { font:inherit; font-size:12px; color:var(--fg); background:var(--panel); border:1px solid #3a3a44;
           border-radius:999px; padding:2px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#10131a; font-weight:600; }
  main { padding:12px 14px 8px; }
  .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .grid.s { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .grid.l { grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); }
  figure { margin:0; background:var(--card); border-radius:8px; overflow:hidden; cursor:zoom-in; }
  figure img { display:block; width:100%; height:auto; background:#fff; }
  figcaption { padding:5px 8px; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  #empty { color:var(--dim); padding:24px 4px; }
  .hidden { display:none; }
  .lightbox { position:fixed; inset:0; z-index:50; background:rgba(10,10,12,.94);
              display:flex; align-items:center; justify-content:center; }
  /* 必须用两个类选择器: 否则同为单类选择器的 .lightbox 里的 display:flex 会盖掉 .hidden */
  .lightbox.hidden { display:none; }
  .lightbox img { max-width:92vw; max-height:86vh; background:#fff; border-radius:6px; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:24px; padding:4px 12px; }
  .nav.prev { left:10px; } .nav.next { right:10px; }
  .close { position:absolute; top:12px; right:14px; }
  #lb-caption { position:absolute; bottom:12px; left:0; right:0; text-align:center; color:#ddd;
                font-variant-numeric:tabular-nums; }
  footer { color:#6f6f78; font-size:12px; padding:0 14px 24px; }
</style>
</head>
<body>
<header>
  <h1>StarRosette 图形大全 <small id="count"></small></h1>
  <div class="row"><span class="label">花型</span><div class="chips" id="chips-f"></div></div>
  <div class="row"><span class="label">N</span><div class="chips" id="chips-n"></div></div>
  <div class="row"><span class="label">等级</span><div class="chips" id="chips-l"></div></div>
  <div class="row"><span class="label">缩略图</span><div class="chips" id="chips-s"></div>
       <button id="reset">重置筛选</button></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty" class="hidden">没有符合筛选条件的图片</div>
</main>
<footer><!--__GENERATED__--></footer>
<div class="lightbox hidden" id="lightbox">
  <button class="nav prev" id="prev" title="上一张 (←)">‹</button>
  <img id="lb-img" alt="">
  <button class="nav next" id="next" title="下一张 (→)">›</button>
  <button class="close" id="close" title="关闭 (Esc)">✕</button>
  <div id="lb-caption"></div>
</div>
<script>
const FILES = /*__FILES__*/;

const data = [];
FILES.forEach(function (name) {
  const m = /^([A-Za-z]+)_n(\d+)_l(\d+)\.png$/.exec(name);
  if (m) data.push({ name: name, f: m[1], n: parseInt(m[2], 10), l: parseInt(m[3], 10) });
});
data.sort(function (a, b) { return a.f.localeCompare(b.f) || a.n - b.n || a.l - b.l; });

const sel = { f: new Set(), n: new Set(), l: new Set() };
const chips = { f: [], n: [], l: [] };
const cards = [];
let shown = [];
let current = 0;

const grid = document.getElementById('grid');
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-caption');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

function makeChip(label, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

function buildChips(key) {
  const box = document.getElementById('chips-' + key);
  const values = Array.from(new Set(data.map(function (d) { return d[key]; })));
  values.sort(function (a, b) { return (typeof a === 'number') ? a - b : a.localeCompare(b); });

  const all = makeChip('全部', function () { sel[key].clear(); apply(); });
  box.appendChild(all);
  chips[key] = [{ value: null, el: all }];

  values.forEach(function (v) {
    const b = makeChip(String(v), function () {
      if (sel[key].has(v)) { sel[key].delete(v); } else { sel[key].add(v); }
      apply();
    });
    box.appendChild(b);
    chips[key].push({ value: v, el: b });
  });
}

function buildCards() {
  const frag = document.createDocumentFragment();
  data.forEach(function (d) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = encodeURI(d.name);
    img.alt = d.f + ' n=' + d.n + ' level=' + d.l;

    const cap = document.createElement('figcaption');
    cap.textContent = d.f + '   n=' + d.n + '   level=' + d.l;

    fig.appendChild(img);
    fig.appendChild(cap);
    frag.appendChild(fig);

    const card = { el: fig, d: d };
    fig.addEventListener('click', function () { openLightbox(card); });
    cards.push(card);
  });
  grid.appendChild(frag);
}

function matches(d) {
  return (sel.f.size === 0 || sel.f.has(d.f))
      && (sel.n.size === 0 || sel.n.has(d.n))
      && (sel.l.size === 0 || sel.l.has(d.l));
}

function apply() {
  ['f', 'n', 'l'].forEach(function (key) {
    chips[key].forEach(function (c) {
      c.el.classList.toggle('on', c.value === null ? sel[key].size === 0 : sel[key].has(c.value));
    });
  });

  shown = [];
  cards.forEach(function (card) {
    const ok = matches(card.d);
    card.el.classList.toggle('hidden', !ok);
    if (ok) { shown.push(card); }
  });
  countEl.textContent = shown.length + ' / ' + data.length + ' 张';
  emptyEl.classList.toggle('hidden', shown.length > 0);
}

function renderLightbox() {
  const card = shown[current];
  if (!card) { return; }
  lbImg.src = encodeURI(card.d.name);
  lbCap.textContent = card.d.f + '   n=' + card.d.n + '   level=' + card.d.l
    + '   (' + (current + 1) + '/' + shown.length + ')';
}

function openLightbox(card) {
  current = Math.max(0, shown.indexOf(card));
  renderLightbox();
  lb.classList.remove('hidden');
}

function step(delta) {
  if (!shown.length) { return; }
  current = (current + delta + shown.length) % shown.length;
  renderLightbox();
}

document.getElementById('prev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
document.getElementById('close').addEventListener('click', function () { lb.classList.add('hidden'); });
lb.addEventListener('click', function (e) { if (e.target === lb) { lb.classList.add('hidden'); } });
document.addEventListener('keydown', function (e) {
  if (lb.classList.contains('hidden')) { return; }
  if (e.key === 'ArrowLeft') { step(-1); }
  else if (e.key === 'ArrowRight') { step(1); }
  else if (e.key === 'Escape') { lb.classList.add('hidden'); }
});

const sizeBox = document.getElementById('chips-s');
[['小', 's'], ['中', ''], ['大', 'l']].forEach(function (pair) {
  const b = makeChip(pair[0], function () {
    grid.className = 'grid' + (pair[1] ? ' ' + pair[1] : '');
    Array.from(sizeBox.children).forEach(function (el) { el.classList.remove('on'); });
    b.classList.add('on');
  });
  if (!pair[1]) { b.classList.add('on'); }
  sizeBox.appendChild(b);
});

document.getElementById('reset').addEventListener('click', function () {
  sel.f.clear(); sel.n.clear(); sel.l.clear(); apply();
});

buildChips('f');
buildChips('n');
buildChips('l');
buildCards();
apply();
</script>
</body>
</html>
